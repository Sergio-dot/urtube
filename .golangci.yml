version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build fixtures with fixed paths and scripts on purpose.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
