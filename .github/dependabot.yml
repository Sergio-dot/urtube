# Weekly dependency updates, one grouped pull request per ecosystem. The
# cooldown waits a week after a release before proposing it (security
# updates are not delayed), so short-lived bad releases are skipped.
# yt-dlp is pinned by URL and checksum, which Dependabot can't update:
# .github/workflows/update-ytdlp.yml handles it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The types must match the Node.js version that builds the frontend
      # (22, as in ci.yml and the Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 doesn't accept TypeScript 7 as a peer dependency
      # yet, so npm ci fails. Remove once it does.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node.js majors change deliberately, from one LTS line to the next and
      # together with ci.yml; odd-numbered releases are short-lived.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
