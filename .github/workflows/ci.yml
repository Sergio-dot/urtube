name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  # Weekly: YouTube changes break yt-dlp and new CVEs appear even when the
  # code doesn't change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/ui/dist
          retention-days: 1

  go:
    name: Go
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/ui/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install -U "yt-dlp[default]"

      - run: go vet ./...
      - run: go build ./...
      # Includes TestIntegration, which downloads from YouTube with the latest
      # yt-dlp.
      - run: go test -race -v ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # internal/ui embeds the built frontend; an empty one is enough to
      # type-check.
      - name: Stub the built frontend
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/index.html

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: urtube:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name urtube --read-only --health-interval=2s \
            --tmpfs /tmp --tmpfs /var/tmp:mode=1777 --tmpfs /data:mode=1777 \
            --tmpfs /downloads:uid=1000,gid=1000 \
            urtube:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' urtube)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' urtube)" = true ] || break
            sleep 2
          done
          docker logs urtube
          docker exec urtube yt-dlp --version
          docker exec urtube deno --version
          docker exec urtube ffmpeg -version | head -1
          test "$status" = healthy

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: urtube:ci
          scanners: vuln
          # Debian ships many CVEs it has decided not to fix; fail only on
          # ones a rebuild or dependency bump can actually fix.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes the image to ghcr.io/sergio-dot/urtube once everything above has
  # passed: for main (also on the weekly run, which picks up Debian security
  # updates) and for v* tags. Pull requests never publish.
  publish:
    name: Publish image
    needs: [frontend, go, lint, image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest and main: the newest main build; sha-<commit>: every build, for
      # pinning or rolling back; 1.2.3 and 1.2 from v1.2.3 tags.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sergio-dot/urtube
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
