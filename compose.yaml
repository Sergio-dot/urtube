# Usage: set LIBRARY_DIR (and PUID/PGID, optionally MEDIA_ROOT) in a .env file
# next to this one, then
#   docker compose up -d                          # first start
#   docker compose pull && docker compose up -d   # update
# To run your own changes instead of the published image:
#   docker compose up -d --build
#
# Host folders are mounted at the same path inside the container, so the
# paths shown and typed in the app's Settings are the real ones on this
# machine.
services:
  urtube:
    # Published by CI from main. IMAGE_TAG pins a version: "1.2.3", or
    # "sha-<commit>" to roll back to a specific build.
    image: ghcr.io/sergio-dot/urtube:${IMAGE_TAG:-latest}
    build: .
    container_name: urtube
    restart: unless-stopped
    # Run as the owner of the library so downloaded files belong to them
    # (`id -u` / `id -g` of that user on the host).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      URTUBE_MAX_CONCURRENT_DOWNLOADS: "2"
      # Running downloads may finish for up to this long on shutdown; keep it
      # below stop_grace_period so Docker doesn't kill urtube first.
      URTUBE_SHUTDOWN_TIMEOUT: 60s
      URTUBE_LOG_LEVEL: info
      # Default download folder, e.g. a Jellyfin music library.
      URTUBE_DOWNLOAD_DIR: ${LIBRARY_DIR:?set LIBRARY_DIR in .env to an absolute host path}
      # Settings can only pick folders inside this one.
      URTUBE_DOWNLOAD_ROOT: ${MEDIA_ROOT:-${LIBRARY_DIR}}
    volumes:
      # The host folder urtube may save into: MEDIA_ROOT, or just LIBRARY_DIR.
      # It must already exist, owned by PUID:PGID: Docker would otherwise
      # create it owned by root, where urtube can't write.
      - type: bind
        source: ${MEDIA_ROOT:-${LIBRARY_DIR}}
        target: ${MEDIA_ROOT:-${LIBRARY_DIR}}
        bind:
          create_host_path: false
      # In-progress downloads, kept on disk rather than in memory.
      - work:/var/tmp
      # Settings saved from the app.
      - data:/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 70s

volumes:
  work:
  data:
